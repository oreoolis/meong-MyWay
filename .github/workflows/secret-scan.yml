# Stops credentials reaching the repo, and stops server-side credentials
# reaching the browser bundle. Two different leaks, so two different jobs.
#
# Nothing here needs a secret of its own, so it also runs on pull requests from
# forks, where GITHUB_TOKEN is read-only.

name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly. History does not change, but gitleaks' rules do — a credential
    # format that had no rule when it was committed gets caught on a later run.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Has a credential ever been committed?
  # ---------------------------------------------------------------------------
  committed-secrets:
    name: Committed secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, not the checked-out tree. Without this the
          # scan sees one commit and passes on a repo with a key in commit #2.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact keeps the secret out of the Actions log. A CI log that prints
      # the key it just found has published it to everyone who can read the run.
      - name: Scan full history
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif \
            .

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-findings
          path: gitleaks.sarif
          retention-days: 7

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## A credential is in the git history"
            echo ""
            echo "**Rotate it first.** It is on GitHub's servers and in every"
            echo "clone; rewriting history does not un-publish it, and rotation"
            echo "is the only step that actually revokes access."
            echo ""
            echo "1. Revoke/rotate the credential at its provider (IAM, SSG portal)."
            echo "2. Remove it from the working tree and confirm the path is"
            echo "   covered by \`.gitignore\`."
            echo "3. Only then consider purging history with \`git filter-repo\`,"
            echo "   force-pushing with the team aware."
            echo ""
            echo "The redacted finding is attached to this run as"
            echo "\`gitleaks-findings\`. If it is a false positive, add a narrow"
            echo "allowlist to \`.gitleaks.toml\` — scoped to a rule and a path,"
            echo "never a bare path."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Could a credential be committed next time?
  # ---------------------------------------------------------------------------
  env-file-hygiene:
    name: Env-file hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No env file is tracked (except the template)
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Tracked env file(s) found. These belong in .gitignore:"
            echo "$tracked" | while read -r f; do echo "::error file=$f::$f is tracked"; done
            exit 1
          fi
          echo "OK: no tracked env files."

      - name: No Terraform state or variable file is tracked
        run: |
          set -euo pipefail
          # State holds every output in plaintext; tfvars is where credentials
          # get pasted. .terraform.lock.hcl is committed on purpose and does
          # not match either pattern.
          tracked="$(git ls-files | grep -E '\.tfstate(\.backup)?$|\.tfvars(\.json)?$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Tracked Terraform state/vars found:"
            echo "$tracked" | while read -r f; do echo "::error file=$f::$f is tracked"; done
            exit 1
          fi
          echo "OK: no tracked Terraform state or variable files."

      # The check above catches a file already committed. This one catches the
      # gap that lets the *next* one through — the root .gitignore listed only
      # `.env` and `.env.local`, so `.env.production` was committable.
      - name: .gitignore actually covers every env variant
        run: |
          set -euo pipefail
          fail=0
          for dir in "" "frontend/meong-my-way/" "iac/"; do
            for name in .env .env.local .env.production .env.development .env.test .env.staging; do
              path="${dir}${name}"
              if ! git check-ignore -q "$path"; then
                echo "::error::$path is not covered by .gitignore"
                fail=1
              fi
            done
          done
          # The template must stay committable, or the setup instructions break.
          if git check-ignore -q "frontend/meong-my-way/.env.example"; then
            echo "::error::.env.example is gitignored; it is the template and must be committed"
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            echo "OK: env paths are ignored, template is not."
          fi
          exit "$fail"

      - name: No secret is exposed through a NEXT_PUBLIC_ name
        run: |
          set -euo pipefail
          # Anything NEXT_PUBLIC_ is inlined into the browser bundle by Next.js,
          # so the prefix turns a server secret into a published one.
          if git grep -nIE 'NEXT_PUBLIC_[A-Z0-9_]*(SECRET|PASSWORD|PRIVATE|CREDENTIAL|ACCESS_KEY|SESSION_TOKEN|_TOKEN)' -- . ':!.github/workflows/secret-scan.yml'; then
            echo "::error::A NEXT_PUBLIC_ variable is named like a secret. Drop the prefix and read it server-side."
            exit 1
          fi
          echo "OK: no secret-shaped NEXT_PUBLIC_ names."

      - name: Client components do not read server-only env vars
        run: |
          set -euo pipefail
          fail=0
          # In a client component every process.env read must be NEXT_PUBLIC_;
          # anything else is a server value being pulled toward the bundle.
          files="$(git ls-files 'frontend/meong-my-way/src/*.ts' 'frontend/meong-my-way/src/*.tsx' 'frontend/meong-my-way/src/**/*.ts' 'frontend/meong-my-way/src/**/*.tsx')"
          for f in $files; do
            grep -qE "^[[:space:]]*[\"']use client[\"']" "$f" || continue
            bad="$(grep -oE 'process\.env\.[A-Za-z0-9_]+' "$f" | grep -v 'process\.env\.NEXT_PUBLIC_' || true)"
            if [ -n "$bad" ]; then
              echo "::error file=$f::client component reads server-only env: $(echo "$bad" | tr '\n' ' ')"
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then
            echo "OK: client components read only NEXT_PUBLIC_ vars."
          fi
          exit "$fail"

  # ---------------------------------------------------------------------------
  # 3. Did a credential reach the browser bundle?
  # ---------------------------------------------------------------------------
  #
  # The checks above are static. This one is empirical: build the app with
  # uniquely-shaped fake values in the server-only variables, then look for
  # those values in the JavaScript that ships to browsers. If a canary appears
  # in .next/static, that variable is being inlined into the client bundle —
  # whatever import or config change caused it.
  #
  # Scope, measured rather than assumed. Next.js does NOT inline a
  # non-NEXT_PUBLIC_ variable into the client bundle even when a client
  # component reads it directly — that was verified against this app, and it is
  # why the NEXT_PUBLIC_ naming check above is the primary control for the
  # common mistake. What this job catches is the config-level leak that no
  # naming rule can see: an `env` block in next.config.ts, a DefinePlugin, or
  # any future bundler change that starts inlining server values. That vector
  # was also verified — an injected `env: { AWS_SECRET_ACCESS_KEY: ... }` makes
  # this job fail, which is the point of keeping it.
  #
  # Fake values mean this needs no repository secrets and is safe on forks.
  client-bundle-leak:
    name: Client bundle leak check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/meong-my-way
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/meong-my-way/package-lock.json

      - run: npm ci

      - name: Build with canary credentials
        env:
          # Server-only. None of these may appear in the client bundle.
          AWS_ACCESS_KEY_ID: AKIA0CANARY0ACCESS0ID
          AWS_SECRET_ACCESS_KEY: cANARY7SECRET7ACCESS7KEY7DO7NOT7SHIP7THIS
          AWS_SESSION_TOKEN: cANARY7SESSION7TOKEN7DO7NOT7SHIP7THIS
          SSG_CLIENT_ID: canary-ssg-client-id-do-not-ship
          SSG_CLIENT_SECRET: cANARY7SSG7CLIENT7SECRET7DO7NOT7SHIP
          # Public by design — present so the build resolves, never asserted on.
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-southeast-1_CANARY
          NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: canarypublicclientid
          S3_BUCKET_NAME: canary-bucket
          DYNAMODB_RESUMES_TABLE: canary-resumes
          DYNAMODB_ANALYSES_TABLE: canary-analyses
        run: npm run build

      - name: Assert no canary reached .next/static
        run: |
          set -euo pipefail
          if [ ! -d .next/static ]; then
            echo "::error::.next/static missing — the build produced no client bundle, so this check proved nothing."
            exit 1
          fi
          # Matched on the distinctive server-only canary markers. The public
          # Cognito values are expected in the bundle and are deliberately not
          # part of this pattern.
          leaked="$(grep -rlE 'cANARY7|AKIA0CANARY|canary-ssg-client-id' .next/static || true)"
          if [ -n "$leaked" ]; then
            echo "::error::Server-only credentials were inlined into the client bundle:"
            echo "$leaked" | while read -r f; do echo "::error file=$f::$f contains a canary credential"; done
            exit 1
          fi
          echo "OK: no server-only canary in .next/static."
