name: Terraform Test

on:
  pull_request:
    # The Terraform itself has to be in here. Listing only the workflow file
    # meant this never ran on a change to iac/** — the one thing it validates
    # was the one thing that could not trigger it.
    paths:
      - iac/**
      - lambda/**
      - .trivyignore.yaml
      - .github/workflows/verify-infra.yml

concurrency:
  group: terraform-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

#validate tf files
jobs:
  format-and-validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Validate All Modules
        id: validate
        run: |
          STATUS=0
          for dir in $(find . -name "*.tf" -exec dirname {} \; | sort -u); do
            echo "::group::Validating $dir"
            cd "$dir"
            terraform init -backend=false -input=false > /dev/null 2>&1
            if ! terraform validate; then
              STATUS=1
            fi
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done
          exit $STATUS

      - name: Post Format Results
        if: steps.fmt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Terraform Format Check Failed**\n\nRun \`terraform fmt -recursive\` locally and push the changes.`
            })

      - name: Fail on format error
        if: steps.fmt.outcome == 'failure'
        run: exit 1

  #verify provider specific issues
  lint:
    name: Lint
    needs: format-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
  
      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Run TFLint
        run: |
          for dir in $(find . -name "*.tf" -exec dirname {} \; | sort -u); do
            echo "::group::Linting $dir"
            tflint --chdir="$dir"
            echo "::endgroup::"
          done

  #scan for misconfigurations
  security:
    name: Security Scan
    needs: format-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          # Path-scoped suppressions with written justifications. See the file:
          # the only entry is AWS-0132 on the public job-postings bucket.
          trivyignores: '.trivyignore.yaml'
  
      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          quiet: true
          output_format: github_failed_only
        
