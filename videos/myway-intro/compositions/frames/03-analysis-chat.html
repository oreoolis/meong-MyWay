        for (let i = EVIDENCE_TIMELINE.length - 1; i >= 0; i--) if (time >= EVIDENCE_TIMELINE[i].start) return EVIDENCE_TIMELINE[i];

            chips.forEach((chip, i) => {
              chip.style.background = i === index ? "rgba(59,130,246,.12)" : "rgba(255,255,255,.58)";

            lastEvidence = entry.title;

        }
      }, 1.42);

      tl.fromTo(resolveLine, { scale: 0, opacity: 0, y: 8 }, { scale: 1, opacity: 1, y: 0, duration: .48, ease: "power3.out" }, 4.3);
