      const planLockup = root.querySelector('[class~="02-six-agents-plan-lockup"]');

      const ringLength = ring.getTotalLength();
      ring.style.strokeDasharray = `${ringLength}`;
      ring.style.strokeDashoffset = `${ringLength}`;
      paths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const signalRoutes = [
        [960, 184, 960, 292],
        [1360, 250, 1277, 350],
        [1370, 630, 1278, 550],
        [960, 710, 960, 608],
        [550, 630, 642, 550],

        { scale: 0.82, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.48, ease: 'power3.out' },
        0.02
      );
      tl.to(ring,

        0.06
      );
      tl.fromTo(initialLockup,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.46, ease: 'power2.out' },
        0.18
      );
      nodes.forEach((node, index) => {
        const at = 0.82 + index * 0.28;

          { scale: 0, opacity: 0, y: 14 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
          at
        );
        tl.to(paths[index],
          { strokeDashoffset: 0, duration: 0.48, ease: 'power2.out' },
          at + 0.08

      tl.to(paths,

          { attr: { cx: route[0], cy: route[1] }, opacity: 0 },
          { attr: { cx: route[2], cy: route[3] }, opacity: 1, duration: 0.66, ease: 'power2.inOut' },
