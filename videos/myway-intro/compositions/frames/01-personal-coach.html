  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="01-personal-coach"]');
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["01-personal-coach"] = tl;

      const topPath = root.querySelector('[id="f01-personal-coach-top-path"]');
      const mainPath = root.querySelector('[id="f01-personal-coach-route-main"]');
      const upPath = root.querySelector('[id="f01-personal-coach-route-up"]');
      const downPath = root.querySelector('[id="f01-personal-coach-route-down"]');
      [topPath, mainPath, upPath, downPath].forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = `${length}`;
        path.style.strokeDashoffset = `${length}`;
      });

      const kicker = root.querySelector('[class~="01-personal-coach-kicker"]');
      const brand = root.querySelector('[class~="01-personal-coach-brand"]');
      const headlineWords = root.querySelectorAll('[class~="01-personal-coach-headline"] span');
      const subline = root.querySelector('[class~="01-personal-coach-subline"]');
      const resume = root.querySelector('[class~="01-personal-coach-resume-card"]');
      const cycleShell = root.querySelector('[class~="01-personal-coach-cycle-shell"]');
      const cycleText = root.querySelector('[id="f01-personal-coach-cycle-text"]');
      const finalChips = root.querySelectorAll('[class~="01-personal-coach-final-chip"]');
      const destination = root.querySelector('[class~="01-personal-coach-destination"]');
      const destinationText = root.querySelector('[id="f01-personal-coach-destination-text"]');

      tl.fromTo(kicker, { x: -90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.46, ease: 'power2.out' }, 0.04);
      tl.fromTo(brand, { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.1);
      tl.to(topPath, { strokeDashoffset: 0, duration: 0.72, ease: 'power2.out' }, 0.18);

      tl.set(headlineWords, { x: -42, opacity: 0 }, 0);
      tl.to(headlineWords[0], { x: 0, opacity: 1, duration: 0.26, ease: 'power2.out' }, 0.94);
      tl.to(headlineWords[1], { x: 0, opacity: 1, duration: 0.26, ease: 'power2.out' }, 1.22);
      tl.fromTo(subline, { x: 54, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: 'power2.out' }, 1.42);
      tl.fromTo(resume, { x: -70, opacity: 0 }, { x: 0, opacity: 1, duration: 0.62, ease: 'power2.out' }, 1.1);
      tl.to(mainPath, { strokeDashoffset: 0, duration: 1.3, ease: 'power2.out' }, 1.24);
      tl.fromTo(cycleShell, { x: 54, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: 'power2.out' }, 1.2);

      const ROUTES = [
        { title: 'Progress', body: 'forward', hold: 0.12 },
        { title: 'Pivot', body: 'change', hold: 0.12 },
        { title: 'Explore', body: 'discover', hold: 0.25 }
      ];
      let routeCumulative = 0;
      const ROUTE_TIMELINE = ROUTES.map((entry) => {
        const duration = 0.22 + entry.body.length * 0.02 + entry.hold;
        const start = routeCumulative;
        routeCumulative += duration;
        return { ...entry, start, end: routeCumulative };
      });
      const routeAt = (time) => {
        for (let i = ROUTE_TIMELINE.length - 1; i >= 0; i -= 1) {
          if (time >= ROUTE_TIMELINE[i].start) return ROUTE_TIMELINE[i];
        }
        return ROUTE_TIMELINE[0];
      };
      const routeDriver = { t: 0 };
      let lastRoute = '';
      tl.to(routeDriver, {
        t: routeCumulative,
        duration: 1.38,
        ease: 'none',
        onUpdate: () => {
          const route = routeAt(routeDriver.t);
          if (route.title !== lastRoute) {
            cycleText.textContent = route.title;
            lastRoute = route.title;
          }
        }
      }, 1.2);

      tl.set(cycleShell, { opacity: 0 }, 2.62);
      tl.to(upPath, { strokeDashoffset: 0, duration: 0.54, ease: 'power2.out' }, 2.62);
      tl.to(downPath, { strokeDashoffset: 0, duration: 0.5, ease: 'power2.out' }, 2.78);
      tl.set(finalChips, { scale: 0.76, opacity: 0 }, 0);
      tl.to(finalChips[0], { scale: 1, opacity: 1, duration: 0.34, ease: 'power2.out' }, 2.62);
      tl.to(finalChips[1], { scale: 1, opacity: 1, duration: 0.34, ease: 'power2.out' }, 2.98);
      tl.to(finalChips[2], { scale: 1, opacity: 1, duration: 0.34, ease: 'power2.out' }, 3.34);
      tl.fromTo(destination, { scale: 0.78, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.52, ease: 'power2.out' }, 2.72);

      const DESTINATION_SEQUENCE = [
        { t: 0.0, text: 'YOUR' },
        { t: 0.22, text: 'YOUR NEXT' },
        { t: 0.48, text: 'YOUR NEXT MOVE' }
      ];
      const destinationAt = (time) => {
        for (let i = DESTINATION_SEQUENCE.length - 1; i >= 0; i -= 1) {
          if (time >= DESTINATION_SEQUENCE[i].t) return DESTINATION_SEQUENCE[i].text;
        }
        return DESTINATION_SEQUENCE[0].text;
      };
      const destinationDriver = { t: 0 };
      let lastDestination = '';
      tl.to(destinationDriver, {
        t: 1.16,
        duration: 1.16,
        ease: 'none',
        onUpdate: () => {
          const text = destinationAt(destinationDriver.t);
          if (text !== lastDestination) {
            destinationText.textContent = text;
            lastDestination = text;
          }
        }
      }, 2.72);
    })();
  </script>
